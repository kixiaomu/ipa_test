name: Build unsigned debug iOS IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build-ios:
    name: Build unsigned debug IPA
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Build unsigned debug iOS app
        run: flutter build ios --debug --no-codesign

      - name: Package unsigned debug IPA
        run: |
          set -euo pipefail
          APP_PATH="$(find build/ios/iphoneos -maxdepth 1 -name '*.app' -print -quit)"
          if [ -z "$APP_PATH" ]; then
            echo "Runner.app not found in build/ios/iphoneos"
            exit 1
          fi
          rm -rf Payload build/ios/ipa
          mkdir -p Payload build/ios/ipa
          cp -R "$APP_PATH" Payload/
          ditto -c -k --sequesterRsrc --keepParent Payload build/ios/ipa/unsigned-debug-ios-app.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v6
        with:
          name: unsigned-debug-ios-ipa
          path: build/ios/ipa/unsigned-debug-ios-app.ipa
          if-no-files-found: error
