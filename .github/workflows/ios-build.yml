name: IOS打包IPA并签名V3

on: 
  workflow_dispatch:

jobs:
  build-ios:
    name: IOS打包
    runs-on: macos-latest

    steps:
      - name: 步骤1 获取代码
        uses: actions/checkout@v6

      - name: 步骤2 安装Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      
      - name: 步骤3 打印Flutter 版本
        run: flutter --version

      - name: 步骤4 安装flutter 依赖
        run: flutter pub get

      - name: 步骤5 P12密钥导入
        uses: apple-actions/import-codesign-certs@v7
        with:
          p12-file-base64: ${{ secrets.IOS_P12_BASE64 }}
          p12-password: ${{ secrets.IOS_P12_PASSWORD }}
