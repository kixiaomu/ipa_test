name: IOS打包IPA并签名V3

on: 
  workflow_dispatch:

jobs:
  build-ios:
    name: IOS打包
    runs-on: macos-latest

    steps:
      - name: 步骤1 获取代码
        uses: actions/checkout@v6

      - name: 步骤2 安装Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      
      - name: 步骤3 打印Flutter 版本
        run: flutter --version

      - name: 步骤4 安装flutter 依赖
        run: flutter pub get

      - name: 步骤5 P12密钥导入
        uses: apple-actions/import-codesign-certs@v7
        with:
          p12-file-base64: ${{ secrets.IOS_P12_BASE64 }}
          p12-password: ${{ secrets.IOS_P12_PASSWORD }}

      - name: 步骤6 安装 Provisioning Profile
        env:
          PROFILE_BASE64: ${{ secrets.IOS_PROFILE_BASE64 }}
        run: |
          set -euo pipefail

          PROFILE_PATH="$RUNNER_TEMP/profile.mobileprovision"
          PROFILE_PLIST="$RUNNER_TEMP/profile.plist"

          test -n "$PROFILE_BASE64" || {
            echo "IOS_PROFILE_BASE64 未配置"
            exit 1
          }

          printf '%s' "$PROFILE_BASE64" | base64 -D > "$PROFILE_PATH"
          security cms -D -i "$PROFILE_PATH" > "$PROFILE_PLIST"

          PROFILE_UUID=$(/usr/libexec/PlistBuddy \
            -c "Print UUID" "$PROFILE_PLIST")

          PROFILE_NAME=$(/usr/libexec/PlistBuddy \
            -c "Print Name" "$PROFILE_PLIST")

          TEAM_ID=$(/usr/libexec/PlistBuddy \
            -c "Print TeamIdentifier:0" "$PROFILE_PLIST")

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"

          cp "$PROFILE_PATH" \
            "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"

          echo "PROFILE_NAME=$PROFILE_NAME" >> "$GITHUB_ENV"
          echo "TEAM_ID=$TEAM_ID" >> "$GITHUB_ENV"

      - name: 步骤7 验证签名材料
        run: |
          set -euo pipefail
          echo "Installed provisioning profile: ${PROFILE_NAME} (Team ID: ${TEAM_ID})"
          security find-identity -v -p codesigning

      - name: 步骤8 创建 ExportOptions.plist
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN"
            "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>teamID</key>
            <string>${TEAM_ID}</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.example.bleLvApp</key>
              <string>${PROFILE_NAME}</string>
            </dict>
          </dict>
          </plist>
          EOF

      - name: 步骤9 生成 Flutter iOS Release 产物
        run: |
          flutter build ios --release --no-codesign

      - name: 步骤10 使用 Distribution 证书归档
        run: |
          set -euo pipefail
          xcodebuild archive \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            -archivePath "$RUNNER_TEMP/Runner.xcarchive" \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME"

      - name: 步骤11 导出已签名 IPA
        run: |
          set -euo pipefail
          mkdir -p build/ios/ipa
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Runner.xcarchive" \
            -exportPath build/ios/ipa \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"

      - name: 步骤12 上传已签名 IPA
        uses: actions/upload-artifact@v6
        with:
          name: signed-release-ios-ipa
          path: build/ios/ipa/*.ipa
          if-no-files-found: error
