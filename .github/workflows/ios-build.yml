name: IOS打包IPA并签名

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install certificate and provisioning profile
        env:
          P12_BASE64: ${{ secrets.IOS_P12_BASE64 }}
          P12_PASSWORD: ""
          PROFILE_BASE64: ${{ secrets.IOS_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.IOS_KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail

          KEYCHAIN_PATH="$RUNNER_TEMP signing.keychain-db"
          CERT_PATH="$RUNNER_TEMP signing.p12"
          PROFILE_PATH="$RUNNER_TEMP profile.mobileprovision"

          # macOS 自带的 base64 使用 -D 解码；同时检查 Secret 不是空值。
          test -n "$P12_BASE64" || { echo "IOS_P12_BASE64 is empty"; exit 1; }
          test -n "$PROFILE_BASE64" || { echo "IOS_PROFILE_BASE64 is empty"; exit 1; }
          printf '%s' "$P12_BASE64" | base64 -D > "$CERT_PATH"
          printf '%s' "$PROFILE_BASE64" | base64 -D > "$PROFILE_PATH"

          test -s "$CERT_PATH" || { echo "Decoded p12 is empty"; exit 1; }
          test -s "$PROFILE_PATH" || { echo "Decoded provisioning profile is empty"; exit 1; }

          # 在导入钥匙串前验证 p12：P12_PASSWORD 为空时应使用 pass:
          # 该证书使用旧版 RC2-40-CBC 加密；OpenSSL 3 需显式启用 legacy provider。
          openssl pkcs12 -in "$CERT_PATH" -info -noout \
            -legacy \
            -passin "pass:${P12_PASSWORD}" >/dev/null

          # 验证 provisioning profile 可被 macOS 解码，避免后续 PlistBuddy 报错。
          security cms -D -i "$PROFILE_PATH" > "$RUNNER_TEMP/profile.plist"

          /usr/libexec/PlistBuddy -c "Print UUID" "$RUNNER_TEMP/profile.plist" >/dev/null
          /usr/libexec/PlistBuddy -c "Print Name" "$RUNNER_TEMP/profile.plist" >/dev/null
          /usr/libexec/PlistBuddy -c "Print TeamIdentifier:0" "$RUNNER_TEMP/profile.plist" >/dev/null

          security create-keychain \
            -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain \
            -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          security import "$CERT_PATH" \
            -P "" \
            -A \
            -T /usr/bin/codesign \
            -T /usr/bin/security \
            -t cert \
            -f pkcs12 \
            -k "$KEYCHAIN_PATH"

          security list-keychains -d user \
            -s "$KEYCHAIN_PATH" login.keychain-db

          security default-keychain -s "$KEYCHAIN_PATH"

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"

          PROFILE_PLIST="$RUNNER_TEMP/profile.plist"

          PROFILE_UUID=$(/usr/libexec/PlistBuddy \
            -c "Print UUID" "$PROFILE_PLIST")

          cp "$PROFILE_PATH" \
            "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"

          echo "PROFILE_UUID=$PROFILE_UUID" >> "$GITHUB_ENV"
          echo "PROFILE_NAME=$(/usr/libexec/PlistBuddy -c "Print Name" "$PROFILE_PLIST")" >> "$GITHUB_ENV"
          echo "TEAM_ID=$(/usr/libexec/PlistBuddy -c "Print TeamIdentifier:0" "$PROFILE_PLIST")" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: flutter pub get

      - name: Create ExportOptions.plist
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN"
            "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>teamID</key>
            <string>${TEAM_ID}</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.example.bleLvApp</key>
              <string>${PROFILE_NAME}</string>
            </dict>
          </dict>
          </plist>
          EOF

      - name: Build signed IPA
        run: |
          flutter build ipa \
            --release \
            --export-options-plist="$RUNNER_TEMP/ExportOptions.plist"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: signed-ios-ipa
          path: build/ios/ipa/*.ipa
          if-no-files-found: error
